name: fnOS package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  fnos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: ./scripts/check.sh
      - name: Build and audit both architectures and the universal FPK
        run: |
          for arch in x86 arm all; do
            ./scripts/build-manual.sh "$arch"
          done
          python3 scripts/audit-fpk.py
